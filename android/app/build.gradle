apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
  // JS bundle entry & hermes
  jsRootDir = file("..")
  entryFile = file("index.js")
  autolinkLibrariesWithApp()
}

android {
  namespace "com.transfo"
  compileSdk 35
  buildToolsVersion "35.0.0"

  defaultConfig {
    applicationId "com.transfo"
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "1.0.0"
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug  // debug-signed so it installs without a keystore
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
}
