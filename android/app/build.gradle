apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
  // RN project root is THIS dir (android/) — node_modules, package.json, index.js all live here,
  // NOT the parent `Transfo/`. The plugin defaults `root` to the gradle-dir parent; set it explicitly.
  root = rootProject.projectDir
  entryFile = file("index.js")
  jsRootDir = rootProject.projectDir
  cliFile = file("node_modules/react-native/cli.js")
  autolinkLibrariesWithApp()
}

android {
  namespace "com.transfo"
  compileSdk 35
  buildToolsVersion "35.0.0"

  defaultConfig {
    applicationId "com.transfo"
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "1.0.0"
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug  // debug-signed so it installs without a keystore
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
}
